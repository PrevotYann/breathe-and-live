name: Publish Foundry system

on:
  push:
    branches:
      - master
    paths:
      - system.json
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: foundry-system-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_REF_NAME: ${{ github.ref_name }}
        run: |
          release_tag="v$(node -p 'JSON.parse(require("fs").readFileSync("system.json", "utf8")).version')"
          if [[ "$EVENT_REF_TYPE" == "tag" && "$EVENT_REF_NAME" != "$release_tag" ]]; then
            echo "Tag must match system.json: $release_tag" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          if gh release view "$release_tag" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: "22"
      - run: npm install
        if: steps.version.outputs.publish == 'true'
      - run: npm test
        if: steps.version.outputs.publish == 'true'
      - run: npm run build
        if: steps.version.outputs.publish == 'true'
      - name: Archive the built system
        if: steps.version.outputs.publish == 'true'
        working-directory: dist
        run: zip -r ../breathe-and-live.zip .
      - name: Publish install manifest and archive
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          notes_file="resources/rules/release-${RELEASE_TAG#v}.md"
          notes_args=(--generate-notes)
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          fi
          gh release create "$RELEASE_TAG" \
            dist/manifest.json dist/system.json breathe-and-live.zip \
            --target "$RELEASE_TARGET" --title "Breathe and Live $RELEASE_TAG" "${notes_args[@]}"
